<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Приложение закрыто</title>
        <style>
            * {
                box-sizing: border-box;
            }
            html,
            body {
                height: 100%;
                margin: 0;
            }
            body {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                background: #3a2c1d;
                background-image: linear-gradient(#0007, #0007),
                    repeating-linear-gradient(45deg, #6b4b2a 0 16px, #5e4224 16px 32px);
                color: #f4f4f4;
                font-family: Arial, Helvetica, sans-serif;
                text-align: center;
            }
            p {
                max-width: 640px;
                margin: 0;
                font-size: clamp(20px, 6vw, 34px);
                font-weight: 700;
                line-height: 1.4;
                text-shadow: 2px 2px 0 #000;
            }
        </style>
    </head>
    <body>
        <p>Приложение закрыто до 24.10.2026 в связи с техническими сбоями</p>
    </body>
</html>
